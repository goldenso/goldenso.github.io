<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PDF 电子书架 | 高奕江</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: #0a0c10;
            color: #eef2ff;
            line-height: 1.5;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #14171f;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b4b6e;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5c7cac;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image:
                linear-gradient(rgba(30, 40, 60, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 40, 60, 0.2) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .bg-glow {
            position: fixed;
            top: -20%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at 30% 20%, rgba(80, 140, 210, 0.2), rgba(10, 12, 16, 0.9));
            z-index: -1;
            filter: blur(70px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem 5rem;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 4rem;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .back-link,
        .folder-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            min-height: 42px;
            padding: 0.45rem 1rem;
            border: 1px solid rgba(95, 158, 255, 0.3);
            border-radius: 40px;
            background: rgba(18, 22, 32, 0.72);
            color: #cddcff;
            font-size: 0.88rem;
            backdrop-filter: blur(6px);
        }

        .back-link {
            transition: all 0.25s ease;
        }

        .back-link:hover {
            border-color: #7aaaff;
            color: #ffffff;
            transform: translateY(-2px);
        }

        .folder-pill {
            color: #9acdff;
        }

        .hero {
            max-width: 760px;
            margin-bottom: 3rem;
        }

        .badge {
            display: inline-block;
            background: rgba(72, 187, 255, 0.18);
            backdrop-filter: blur(4px);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #9acdff;
            border: 1px solid rgba(72, 187, 255, 0.3);
            margin-bottom: 1.2rem;
        }

        h1 {
            font-size: clamp(2.4rem, 7vw, 4.8rem);
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #a0c0ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.8rem;
        }

        .desc {
            font-size: 1rem;
            color: #cbd5f0;
            max-width: 680px;
            line-height: 1.7;
        }

        section {
            margin-bottom: 4rem;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title i {
            font-size: 1.8rem;
            color: #5f9eff;
        }

        .title-line {
            height: 3px;
            width: 50px;
            background: linear-gradient(90deg, #5f9eff, #8cb4ff);
            border-radius: 4px;
            margin-left: 8px;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.8rem;
        }

        .book-card {
            min-height: 128px;
            background: rgba(18, 22, 32, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 1.5rem;
            padding: 1.2rem 1rem;
            border: 1px solid rgba(72, 160, 255, 0.2);
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }

        .book-card:hover {
            border-color: rgba(95, 158, 255, 0.6);
            background: rgba(24, 32, 48, 0.8);
            transform: translateY(-5px);
        }

        .book-card::after {
            content: '';
            position: absolute;
            top: var(--y, 50%);
            left: var(--x, 50%);
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(100,160,255,0.2) 0%, rgba(100,160,255,0) 80%);
            transition: width 0.4s ease, height 0.4s ease, opacity 0.3s;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
        }

        .book-card:hover::after {
            width: 300px;
            height: 300px;
            opacity: 0.6;
        }

        .book-header {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 1;
        }

        .book-header i {
            font-size: 2rem;
            color: #7aaaff;
        }

        .book-name {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .book-meta {
            margin-top: 0.75rem;
            color: #9fb1de;
            font-size: 0.82rem;
            position: relative;
            z-index: 1;
        }

        .empty-card {
            border-style: dashed;
            color: #b8c7ef;
        }

        .footer-note {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.8rem;
            color: #6f7d9e;
        }

        @media (max-width: 750px) {
            .topbar {
                align-items: flex-start;
                flex-direction: column;
                margin-bottom: 3rem;
            }

            .section-title {
                justify-content: center;
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>

<main class="container">
    <div class="topbar">
        <a class="back-link" href="index.html">
            <i class="fas fa-arrow-left"></i>
            返回主页
        </a>
        <span class="folder-pill">
            <i class="fas fa-folder-open"></i>
            ebooks/
        </span>
    </div>

    <header class="hero">
        <div class="badge">
            <i class="fas fa-book-open"></i> PDF 电子书收藏
        </div>
        <h1>电子书架</h1>
        <p class="desc">
            如果不想去z-library下载，可以来这直接拿。
        </p>
    </header>

    <section>
        <div class="books-grid">
            <a href="ebooks/智能材料与智能系统 (杨大智主编（大连市形状记忆合金研究所）, 主编 杨大智, 杨大智, 杨大智主编, 杨大智) (Z-Library).pdf" target="_blank" rel="noopener noreferrer">
                <article class="book-card">
                    <div class="book-header">
                        <i class="fas fa-file-pdf"></i>
                        <span class="book-name">智能材料与智能系统 (杨大智主编（大连市形状记忆合金研究所）)</span>
                    </div>
                </article>
            </a>
            <a href="ebooks/断裂力学 (丁遂栋主编, 丁遂栋主编, 丁遂栋) (z-library.sk, 1lib.sk, z-lib.sk).pdf" target="_blank" rel="noopener noreferrer">
                <article class="book-card">
                    <div class="book-header">
                        <i class="fas fa-file-pdf"></i>
                        <span class="book-name">断裂力学 (丁遂栋主编, 丁遂栋主编, 丁遂栋)</span>
                    </div>
                </article>
            </a>
             <a href="ebooks/试验方案优化设计与数据分析 (庞超明，黄弘编著) (z-library.sk, 1lib.sk, z-lib.sk).pdf" target="_blank" rel="noopener noreferrer">
                <article class="book-card">
                    <div class="book-header">
                        <i class="fas fa-file-pdf"></i>
                        <span class="book-name">试验方案优化设计与数据分析 (庞超明，黄弘编著)</span>
                    </div>
                </article>
            </a>
            <a href="ebooks/固体物理学（第三版） (胡安, 章维益) (z-library.sk, 1lib.sk, z-lib.sk).pdf" target="_blank" rel="noopener noreferrer">
                <article class="book-card">
                    <div class="book-header">
                        <i class="fas fa-file-pdf"></i>
                        <span class="book-name">固体物理学（第三版） (胡安, 章维益)</span>
                    </div>
                </article>
            </a>
            <a href="ebooks/新时代研究生学术英语综合教程1学生+教师用书pdf+PPT.zip" target="_blank" rel="noopener noreferrer">
                <article class="book-card">
                    <div class="book-header">
                        <i class="fas fa-file-archive"></i>
                        <span class="book-name">新时代研究生学术英语综合教程</span>
                    </div>
                </article>
            </a>
        </div>


          

    <div class="footer-note">
        <i class="far fa-copyright"></i> 2026 高奕江 · PDF 电子书架
    </div>
</main>

<script>
    const cards = document.querySelectorAll('.book-card');
    cards.forEach(card => {
        card.addEventListener('mousemove', (event) => {
            const rect = card.getBoundingClientRect();
            card.style.setProperty('--x', `${event.clientX - rect.left}px`);
            card.style.setProperty('--y', `${event.clientY - rect.top}px`);
        });
    });
</script>
</body>
</html>
